# Builds the web app and publishes it to GitHub Pages on every push to main.
#
# The "Setup Pages" step below turns GitHub Pages on for this repository the
# first time the workflow runs (enablement: true), so there is nothing to click
# beforehand. If your account or organization blocks that, enable it by hand at
# Settings → Pages → Source: "GitHub Actions" and re-run the workflow.
#
# The site is served at https://<owner>.github.io/<repo>/ and works as an
# installable PWA (Add to Home Screen on Android/iOS, install button in Chrome).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Setup Pages (enables Pages on first run)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build (served from /<repo>/)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
