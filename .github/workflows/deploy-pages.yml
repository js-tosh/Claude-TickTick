# Builds the web app and publishes it to GitHub Pages on every push to main.
#
# ONE-TIME SETUP, and it can only be done by a repository admin:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# The Actions token is not allowed to create the Pages site itself, so until
# that switch is flipped the deploy job fails with a 404. The "Setup Pages"
# step below tries to enable it anyway and is allowed to fail, so the build
# still runs either way.
#
# The site is served at https://<owner>.github.io/<repo>/ and works as an
# installable PWA (Add to Home Screen on Android/iOS, install button in Chrome).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Setup Pages (best effort; needs Pages enabled in Settings)
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build (served from /<repo>/)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
